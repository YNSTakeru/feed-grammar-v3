name: Deploy Netlify Prd

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  statuses: write
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Enable Corepack for Yarn
        run: corepack enable

      - name: Set Yarn version
        run: corepack prepare yarn@1.22.22 --activate

      # キャッシュを2つに分割する:
      #   1) node_modules: yarn.lock のみで管理
      #   2) .next/cache: yarn.lock + next.config のみで管理
      # 修正前は両方を同じキーにまとめ、さらに **/*.{js,jsx,ts,tsx} のハッシュを
      # 含めていたため、コード1行の変更で .next/cache まで全失効し、SSG の
      # incremental build が効かず毎回フルビルドになっていた。
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache .next/cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock', 'next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            yarn install --frozen-lockfile && break || {
              echo "Retry $i/3: yarn install failed, retrying in 10 seconds..."
              sleep 10
            }
          done
          if [ $? -ne 0 ]; then
            echo "yarn install failed after 3 attempts"
            exit 1
          fi

      # Netlify CLI に build させる。Next.js は OpenNext adapter が必要なので、
      # `--dir=./out` で古い static export を直接アップロードしない。
      # build command / publish directory は netlify.toml に固定する。
      - name: Deploy to Netlify (production)
        if: github.event_name == 'push'
        run: |
          npx --yes netlify-cli@latest deploy \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --prod \
            --timeout=3600 \
            --message="${DEPLOY_MESSAGE:-deploy}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_PRD }}
          DEPLOY_MESSAGE: ${{ github.event.head_commit.message }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME }}
          A8_DEFAULT_URL: ${{ secrets.A8_DEFAULT_URL }}
          A8_VIDEO_22256_URL: ${{ secrets.A8_VIDEO_22256_URL }}

      - name: Deploy to Netlify (preview)
        if: github.event_name == 'pull_request'
        run: |
          npx --yes netlify-cli@latest deploy \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --alias="deploy-preview-${PR_NUMBER}" \
            --timeout=3600 \
            --message="${DEPLOY_MESSAGE:-preview}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_PRD }}
          PR_NUMBER: ${{ github.event.number }}
          DEPLOY_MESSAGE: ${{ github.event.pull_request.title }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME }}
          A8_DEFAULT_URL: ${{ secrets.A8_DEFAULT_URL }}
          A8_VIDEO_22256_URL: ${{ secrets.A8_VIDEO_22256_URL }}
